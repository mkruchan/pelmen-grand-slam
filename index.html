<!DOCTYPE html>
<html lang="en" data-theme="light" style="color-scheme: light;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Rivalry — Head-to-Head Tennis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --night:#04121B;
  --court:#16537F;
  --court-dark:#103D5E;
  --apron:#14684F;
  --chalk:#EDF5F0;
  --ball:#D9F24F;
  --ball-dim:#9DB33A;
  --net:#08202E;
  --ink:#04121B;
  --line:rgba(237,245,240,.28);
  --panel:rgba(4,18,27,.62);
  --radius:14px;
  --serif:'Barlow Condensed', 'Arial Narrow', sans-serif;
  --body:'Barlow', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body);
  color:var(--chalk);
  background:var(--night);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* ---------- court background ---------- */
.court-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(217,242,79,.16), transparent 60%),
    radial-gradient(90% 60% at 50% 110%, rgba(20,104,79,.45), transparent 70%),
    linear-gradient(180deg,#04121B 0%, #0B2D44 45%, #06202F 100%);
}
.court-bg svg{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.fuzz{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.055;
  background-image:radial-gradient(circle at 1px 1px, #fff 1px, transparent 0);
  background-size:4px 4px;}
.wrap{position:relative;z-index:2;max-width:1060px;margin:0 auto;padding:22px 18px 90px}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;letter-spacing:.06em;font-size:19px;color:var(--ball)}
.brand .ball{width:17px;height:17px;border-radius:50%;background:var(--ball);position:relative;box-shadow:0 0 14px rgba(217,242,79,.55);flex:none}
.brand .ball:before,.brand .ball:after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1.5px solid rgba(4,18,27,.75);clip-path:inset(0 50% 0 0)}
.brand .ball:after{transform:rotate(180deg)}
.status{font-size:12.5px;letter-spacing:.04em;color:rgba(237,245,240,.55);display:flex;align-items:center;gap:7px}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--ball);opacity:.8}
.status.saving .dot{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.2}}

/* ---------- hero ---------- */
.hero{position:relative;border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(180deg, rgba(22,83,127,.55), rgba(8,32,46,.75));
  box-shadow:0 30px 60px -30px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.07);
  padding:26px 20px 22px;overflow:hidden}
.hero:before{content:"";position:absolute;inset:14px;border:1.5px solid var(--line);border-radius:6px;pointer-events:none}
.hero-title{font-family:var(--serif);font-weight:700;font-size:clamp(30px,7vw,58px);line-height:.94;
  text-align:center;margin:4px 0 2px;letter-spacing:.02em;text-transform:uppercase;color:var(--chalk);
  text-shadow:0 2px 0 rgba(0,0,0,.35)}
.hero-sub{text-align:center;font-size:13.5px;color:rgba(237,245,240,.62);margin-bottom:20px;letter-spacing:.03em}
.face-off{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.player{text-align:center;min-width:0}
.frame{position:relative;width:min(100%,208px);margin:0 auto;aspect-ratio:4/5;border-radius:120px 120px 16px 16px;
  overflow:hidden;border:2px solid rgba(237,245,240,.5);background:#0a2231;
  box-shadow:0 18px 40px -20px rgba(0,0,0,.9)}
.frame img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.05) contrast(1.03)}
.frame.champ{border-color:var(--ball);box-shadow:0 0 0 4px rgba(217,242,79,.18),0 18px 40px -20px rgba(0,0,0,.9)}
.pname{font-family:var(--serif);font-weight:700;font-size:clamp(18px,3.6vw,27px);letter-spacing:.05em;
  text-transform:uppercase;margin:12px 0 2px;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.pname button{opacity:.35}
.pwins{font-family:var(--serif);font-size:13px;letter-spacing:.14em;color:rgba(237,245,240,.6);text-transform:uppercase}
.center-col{display:flex;flex-direction:column;align-items:center;gap:10px;align-self:stretch;justify-content:center;padding:0 2px}
.bigscore{font-family:var(--serif);font-weight:700;font-size:clamp(34px,9vw,72px);line-height:1;color:var(--ball);
  text-shadow:0 0 28px rgba(217,242,79,.35);white-space:nowrap}
.netline{flex:1;width:34px;min-height:40px;border-left:1px dashed rgba(237,245,240,.35);border-right:1px dashed rgba(237,245,240,.35);
  background:repeating-linear-gradient(0deg,rgba(237,245,240,.14) 0 1px,transparent 1px 5px),
             repeating-linear-gradient(90deg,rgba(237,245,240,.14) 0 1px,transparent 1px 5px)}
.vs{font-family:var(--serif);letter-spacing:.2em;font-size:12px;color:rgba(237,245,240,.5)}
.statline{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px}
.stat{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;letter-spacing:.03em;
  background:rgba(4,18,27,.4);color:rgba(237,245,240,.85)}
.stat b{font-family:var(--serif);font-size:15px;color:var(--ball);letter-spacing:.06em}

/* flying ball (single load moment) */
#flyball{position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:var(--ball);
  box-shadow:0 0 18px rgba(217,242,79,.7);z-index:5;opacity:0;pointer-events:none}

/* ---------- sections ---------- */
h2.sec{font-family:var(--serif);font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  font-size:clamp(20px,3.4vw,27px);margin:40px 0 14px;display:flex;align-items:center;gap:12px;color:var(--chalk)}
h2.sec:after{content:"";flex:1;height:1px;background:var(--line)}

/* trophy cabinet */
.cabinet{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cab{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--panel)}
.cab h3{font-family:var(--serif);font-size:18px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px}
.cab .count{font-family:var(--serif);font-size:44px;line-height:1;color:var(--ball)}
.cab .count small{font-family:var(--body);font-size:12px;letter-spacing:.1em;color:rgba(237,245,240,.55);display:block;margin-top:4px;text-transform:uppercase}
.cab ul{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.cab li{font-size:13.5px;line-height:1.35;color:rgba(237,245,240,.85);display:flex;gap:8px;align-items:flex-start}
.cab li span.t{font-weight:600}
.cab li em{font-style:normal;color:var(--ball);display:block;font-size:12.5px}
.cab .none{font-size:13px;color:rgba(237,245,240,.45);margin-top:12px}

/* tournaments */
.tourn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.tcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:var(--radius);padding:16px;
  background:linear-gradient(180deg,rgba(22,83,127,.38),rgba(6,26,38,.6));color:inherit;cursor:pointer;font:inherit;
  transition:border-color .16s ease, transform .16s ease}
.tcard:hover,.tcard:focus-visible{border-color:var(--ball);transform:translateY(-2px)}
.tcard.active{border-color:var(--ball);background:linear-gradient(180deg,rgba(217,242,79,.16),rgba(6,26,38,.7))}
.tcard .emoji{font-size:26px;display:block;margin-bottom:6px}
.tcard .tname{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;line-height:1.05}
.tcard .meta{font-size:12.5px;color:rgba(237,245,240,.6);margin-top:7px}
.tcard .winner{margin-top:9px;font-size:12.5px;color:var(--ball);font-weight:600}

/* tournament detail */
.detail{margin-top:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden}
.detail-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  padding:16px 18px;border-bottom:1px solid var(--line);background:rgba(22,83,127,.28)}
.detail-head h3{margin:0;font-family:var(--serif);font-size:24px;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.detail-head .sub{font-size:12.5px;color:rgba(237,245,240,.6);margin-top:3px}
.rowacts{display:flex;gap:8px;flex-wrap:wrap}
.matches{padding:6px 10px 14px}
.match{display:grid;grid-template-columns:1fr auto 1fr auto;gap:10px;align-items:center;padding:12px 8px;border-bottom:1px dashed rgba(237,245,240,.14)}
.match:last-child{border-bottom:none}
.match .side{font-family:var(--serif);font-size:17px;letter-spacing:.04em;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match .side.r{text-align:right}
.match .side.win{color:var(--ball)}
.match .side.win:before{content:"●";font-size:9px;vertical-align:middle;margin-right:6px}
.match .side.r.win:before{content:none}
.match .side.r.win:after{content:"●";font-size:9px;vertical-align:middle;margin-left:6px}
.sets{display:flex;gap:6px;justify-content:center}
.setbox{font-family:var(--serif);font-weight:700;font-size:16px;letter-spacing:.02em;background:var(--net);
  border:1px solid rgba(237,245,240,.2);border-radius:6px;padding:3px 9px;white-space:nowrap}
.setbox.bagel{border-color:var(--ball);color:var(--ball)}
.mnote{grid-column:1/-1;font-size:12.5px;color:rgba(237,245,240,.55);padding-left:2px}
.mdate{grid-column:1/-1;font-size:11.5px;letter-spacing:.08em;color:rgba(237,245,240,.4);text-transform:uppercase}
.empty{padding:28px 18px;text-align:center;color:rgba(237,245,240,.55);font-size:14px}

/* buttons */
button{font-family:inherit}
.btn{border:1px solid var(--line);background:rgba(4,18,27,.5);color:var(--chalk);border-radius:999px;
  padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover,.btn:focus-visible{border-color:var(--ball);background:rgba(217,242,79,.12)}
.btn.primary{background:var(--ball);color:var(--ink);border-color:var(--ball)}
.btn.primary:hover{background:#e6ff63}
.btn.small{padding:5px 11px;font-size:12px}
.iconbtn{border:none;background:none;color:inherit;cursor:pointer;padding:3px;font-size:13px;opacity:.5;line-height:1}
.iconbtn:hover,.iconbtn:focus-visible{opacity:1;color:var(--ball)}
:focus-visible{outline:2px solid var(--ball);outline-offset:2px}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(2,10,16,.78);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto}
.modal{width:100%;max-width:440px;background:#08222F;border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:0 40px 80px -20px rgba(0,0,0,.9);margin:auto}
.modal h3{font-family:var(--serif);font-size:22px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;letter-spacing:.09em;color:rgba(237,245,240,.6);margin-bottom:6px}
.field input[type=text],.field input[type=date],.field input[type=number],.field select,.field textarea{
  width:100%;background:rgba(4,18,27,.7);border:1px solid var(--line);border-radius:8px;color:var(--chalk);
  padding:9px 11px;font-size:14px;font-family:inherit}
.field textarea{resize:vertical;min-height:58px}
.setrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.setrow span{font-size:12px;color:rgba(237,245,240,.5);width:42px;font-family:var(--serif);letter-spacing:.08em}
.setrow input{width:100%;text-align:center;font-family:var(--serif);font-size:17px}
.setrow .dash{width:auto;color:rgba(237,245,240,.4)}
.modal-acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.modal-acts .left{margin-right:auto}
.hint{font-size:12px;color:rgba(237,245,240,.5);line-height:1.4}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:var(--ball);color:var(--ink);
  padding:10px 18px;border-radius:999px;font-weight:600;font-size:13.5px;box-shadow:0 12px 30px -10px rgba(0,0,0,.7)}
footer{margin-top:44px;text-align:center;font-size:12.5px;color:rgba(237,245,240,.4);line-height:1.6}

@media (max-width:640px){
  .face-off{gap:6px}
  .frame{border-radius:80px 80px 12px 12px}
  .cabinet{grid-template-columns:1fr}
  .match{grid-template-columns:1fr auto 1fr;gap:6px}
  .match .rowacts{grid-column:1/-1;justify-content:flex-end}
  .hero{padding:20px 12px 18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

var state = JSON.parse(document.getElementById('state').textContent);
var selected = state.tournaments.length ? state.tournaments[0].id : null;
var canEdit = true;        // until proven otherwise
var mode = 'unknown';      // 'live' | 'local'
var saveTimer = null, saving = false, dirty = false;

/* ---------------- persistence ---------------- */
function buildDoc(s){
  var i = PRISTINE.indexOf(STATE_OPEN);
  if(i < 0) return null;
  var j = PRISTINE.indexOf('<\/script>', i);
  if(j < 0) return null;
  var json = JSON.stringify(s).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n' + PRISTINE.slice(0, i + STATE_OPEN.length) + json + PRISTINE.slice(j);
}
var LSKEY = 'rivalry:' + location.pathname;
function localSave(){
  try{ localStorage.setItem(LSKEY, JSON.stringify(state)); }catch(e){}
}
function localLoad(){
  try{
    var raw = localStorage.getItem(LSKEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
function setStatus(text, busy){
  var el = document.getElementById('status');
  if(!el) return;
  el.classList.toggle('saving', !!busy);
  var t = document.getElementById('statusText');
  if(t) t.textContent = text;
}
function scheduleSave(){
  dirty = true;
  setStatus(mode === 'live' ? 'Saving…' : 'Saved on this device', mode === 'live');
  if(mode !== 'live'){ localSave(); dirty = false; setStatus('Saved on this device'); return; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 900);
}
function flush(){
  if(saving || !dirty) return;
  var art = window.__artifact;
  if(!art){ localSave(); dirty = false; setStatus('Saved on this device'); return; }
  var doc = buildDoc(state);
  if(!doc){ localSave(); dirty = false; setStatus('Saved on this device'); return; }
  saving = true; dirty = false;
  setStatus('Saving…', true);
  art.publish(doc).then(function(){
    saving = false;
    setStatus('Saved');
    if(dirty) flush();
  }).catch(function(err){
    saving = false;
    var code = err && err.code;
    if(code === 'conflict'){ return; }
    if(code === 'not_granted' || code === 'not_writer'){
      canEdit = false; mode = 'local'; localSave();
      setStatus('View only');
      render();
      return;
    }
    localSave();
    setStatus('Saved on this device');
  });
}

/* ---------------- helpers ---------------- */
function uid(){ return 'x' + Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
}); }
function tour(id){ return state.tournaments.filter(function(t){ return t.id === id; })[0] || null; }
function matchWinner(m){
  var a = 0, b = 0;
  (m.sets || []).forEach(function(s){
    if(s[0] > s[1]) a++; else if(s[1] > s[0]) b++;
  });
  if(a === b) return -1;
  return a > b ? 0 : 1;
}
function allMatches(){
  var out = [];
  state.tournaments.forEach(function(t){
    (t.matches || []).forEach(function(m){ out.push(m); });
  });
  return out;
}
function stats(){
  var s = {wins:[0,0], sets:[0,0], games:[0,0], bagels:[0,0], played:0, streakBy:-1, streak:0};
  var chrono = allMatches().slice().sort(function(a,b){ return (a.date||'') < (b.date||'') ? -1 : 1; });
  chrono.forEach(function(m){
    s.played++;
    var w = matchWinner(m);
    if(w >= 0) s.wins[w]++;
    (m.sets || []).forEach(function(st){
      s.games[0] += Number(st[0]) || 0;
      s.games[1] += Number(st[1]) || 0;
      if(st[0] > st[1]){ s.sets[0]++; if(Number(st[1]) === 0) s.bagels[0]++; }
      else if(st[1] > st[0]){ s.sets[1]++; if(Number(st[0]) === 0) s.bagels[1]++; }
    });
    if(w >= 0){
      if(w === s.streakBy) s.streak++;
      else { s.streakBy = w; s.streak = 1; }
    }
  });
  return s;
}
function fmtDate(d){
  if(!d) return '';
  var parts = d.split('-');
  if(parts.length !== 3) return d;
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return Number(parts[2]) + ' ' + (months[Number(parts[1]) - 1] || '') + ' ' + parts[0];
}

function matchesHtml(list, tid){
  var p = state.players;
  var ms = (list || []).map(function(m,i){ return {m:m,i:i}; }).sort(function(a,b){
    var da = a.m.date || '', db = b.m.date || '';
    if(da !== db) return da < db ? 1 : -1;
    return a.i - b.i;
  }).map(function(x){ return x.m; });
  if(!ms.length){
    return '<div class="empty">Nothing played here yet.' + (canEdit ? ' Add the first match and start the argument.' : '') + '</div>';
  }
  var out = '<div class="matches">';
  ms.forEach(function(m){
    var w = matchWinner(m);
    out += '<div class="match">';
    if(m.date) out += '<div class="mdate">' + esc(fmtDate(m.date)) + '</div>';
    out += '<div class="side' + (w === 0 ? ' win' : '') + '">' + esc(p[0].name) + '</div>';
    out += '<div class="sets">' + (m.sets || []).map(function(st){
      return '<span class="setbox">' + Number(st[0]) + '–' + Number(st[1]) + '</span>';
    }).join('') + '</div>';
    out += '<div class="side r' + (w === 1 ? ' win' : '') + '">' + esc(p[1].name) + '</div>';
    out += '<div class="rowacts">' + (canEdit
      ? '<button class="btn small" data-act="edit-match" data-id="' + tid + '" data-m="' + m.id + '">Edit</button>'
      : '') + '</div>';
    if(m.note) out += '<div class="mnote">' + esc(m.note) + '</div>';
    out += '</div>';
  });
  return out + '</div>';
}
function bucket(tid){
  if(tid === 'friendly'){
    if(!state.friendlies) state.friendlies = [];
    return { get: function(){ return state.friendlies; }, set: function(v){ state.friendlies = v; } };
  }
  var t = tour(tid);
  if(!t) return null;
  if(!t.matches) t.matches = [];
  return { get: function(){ return t.matches; }, set: function(v){ t.matches = v; } };
}

/* ---------------- render ---------------- */
function render(){
  var st = stats();
  var app = document.getElementById('app');
  var p = state.players;
  var champFlags = [0,0];
  state.tournaments.forEach(function(t){ if(t.champion === 0 || t.champion === 1) champFlags[t.champion]++; });

  var html = '';

  /* hero */
  html += '<section class="hero">';
  html += '<h1 class="hero-title">' + esc(state.title) + (canEdit ? ' <button class="iconbtn" data-act="edit-title" aria-label="Edit title">✎</button>' : '') + '</h1>';
  html += '<p class="hero-sub">' + esc(state.subtitle) + '</p>';
  html += '<div class="face-off">';
  [0,1].forEach(function(i){
    if(i === 1){
      html += '<div class="center-col"><span class="netline"></span>'
            + '<div class="bigscore">' + st.wins[0] + ' : ' + st.wins[1] + '</div>'
            + '<span class="vs">MATCHES WON</span><span class="netline"></span></div>';
    }
    var isChamp = st.wins[i] > st.wins[1-i];
    html += '<div class="player">'
      + '<div class="frame' + (isChamp ? ' champ' : '') + '"><img alt="' + esc(p[i].name) + '" src="' + PHOTOS[p[i].photo] + '"></div>'
      + '<div class="pname">' + esc(p[i].name) + (canEdit ? '<button class="iconbtn" data-act="edit-name" data-i="' + i + '" aria-label="Rename">✎</button>' : '') + '</div>'
      + '<div class="pwins">' + champFlags[i] + ' title' + (champFlags[i] === 1 ? '' : 's') + '</div>'
      + '</div>';
  });
  html += '</div>';
  html += '<div class="statline">'
    + '<span class="stat">Matches played <b>' + st.played + '</b></span>'
    + '<span class="stat">Sets <b>' + st.sets[0] + '–' + st.sets[1] + '</b></span>'
    + '<span class="stat">Games <b>' + st.games[0] + '–' + st.games[1] + '</b></span>'
    + (st.streakBy >= 0 && st.streak > 1 ? '<span class="stat">' + esc(p[st.streakBy].name) + ' on a streak <b>' + st.streak + '</b></span>' : '')
    + '</div>';
  if(canEdit) html += '<div class="statline"><button class="btn small" data-act="swap">Swap photos</button></div>';
  html += '<div id="flyball"></div>';
  html += '</section>';

  /* trophy cabinet */
  html += '<h2 class="sec">Trophy cabinet</h2><div class="cabinet">';
  [0,1].forEach(function(i){
    var titles = state.tournaments.filter(function(t){ return t.champion === i; });
    html += '<div class="cab"><h3>' + esc(p[i].name) + '</h3>'
      + '<div class="count">' + titles.length + '<small>titles won</small></div>';
    if(titles.length){
      html += '<ul>' + titles.map(function(t){
        return '<li><span>' + esc(t.emoji || '🏆') + '</span><span><span class="t">' + esc(t.name) + '</span>'
          + (t.prize ? '<em>Prize: ' + esc(t.prize) + '</em>' : '') + '</span></li>';
      }).join('') + '</ul>';
    } else {
      html += '<p class="none">Cabinet is dusty. Nothing here yet.</p>';
    }
    html += '</div>';
  });
  html += '</div>';

  /* tournaments */
  html += '<h2 class="sec">Tournaments</h2><div class="tourn-grid">';
  state.tournaments.forEach(function(t){
    var n = (t.matches || []).length;
    var champ = (t.champion === 0 || t.champion === 1) ? p[t.champion].name : null;
    html += '<button class="tcard' + (t.id === selected ? ' active' : '') + '" data-act="select" data-id="' + t.id + '">'
      + '<span class="emoji">' + esc(t.emoji || '🎾') + '</span>'
      + '<span class="tname">' + esc(t.name) + '</span>'
      + '<div class="meta">' + (t.surface ? esc(t.surface) + ' · ' : '') + n + ' match' + (n === 1 ? '' : 'es') + '</div>'
      + (champ ? '<div class="winner">🏆 ' + esc(champ) + (t.prize ? ' — ' + esc(t.prize) : '') + '</div>' : '')
      + '</button>';
  });
  if(canEdit) html += '<button class="tcard" data-act="add-tournament"><span class="emoji">➕</span><span class="tname">New tournament</span><div class="meta">Name it, pick an emoji, play it</div></button>';
  html += '</div>';

  /* detail */
  var t = tour(selected);
  if(t){
    var champ = (t.champion === 0 || t.champion === 1) ? p[t.champion].name : null;
    html += '<div class="detail"><div class="detail-head"><div>'
      + '<h3>' + esc(t.emoji || '🎾') + ' ' + esc(t.name) + '</h3>'
      + '<div class="sub">' + (t.surface ? esc(t.surface) + ' · ' : '')
      + (champ ? 'Champion: ' + esc(champ) + (t.prize ? ' · Prize: ' + esc(t.prize) : '') : 'No champion crowned yet')
      + '</div></div>';
    if(canEdit){
      html += '<div class="rowacts">'
        + '<button class="btn small" data-act="edit-tournament" data-id="' + t.id + '">Tournament settings</button>'
        + '<button class="btn small primary" data-act="add-match" data-id="' + t.id + '">Add match</button>'
        + '</div>';
    }
    html += '</div>';

    html += matchesHtml(t.matches, t.id);
    html += '</div>';
  }

  /* friendlies */
  var fr = state.friendlies || [];
  var fw = [0,0];
  fr.forEach(function(m){ var w = matchWinner(m); if(w >= 0) fw[w]++; });
  html += '<h2 class="sec">Friendlies</h2>';
  html += '<div class="detail"><div class="detail-head"><div>'
    + '<h3>🍻 Off the record</h3>'
    + '<div class="sub">Casual matches outside the tournaments. '
    + (fr.length ? 'Standing at ' + fw[0] + '–' + fw[1] + ', and none of it counts towards the score above.' : 'None played yet.')
    + '</div></div>'
    + (canEdit ? '<div class="rowacts"><button class="btn small primary" data-act="add-match" data-id="friendly">Add friendly</button></div>' : '')
    + '</div>';
  html += matchesHtml(fr, 'friendly');
  html += '</div>';

  app.innerHTML = html;
}

/* ---------------- modal ---------------- */
function closeModal(){
  var m = document.querySelector('.modal-bg');
  if(m) m.remove();
}
function openModal(title, bodyHtml, onSave, extraLeft){
  closeModal();
  var bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><h3>' + esc(title) + '</h3>'
    + '<div class="mbody">' + bodyHtml + '</div>'
    + '<div class="modal-acts">' + (extraLeft || '')
    + '<button class="btn" data-x="cancel">Cancel</button>'
    + '<button class="btn primary" data-x="ok">Save</button></div></div>';
  document.body.appendChild(bg);
  bg.addEventListener('click', function(e){
    if(e.target === bg) closeModal();
    var x = e.target.closest && e.target.closest('[data-x]');
    if(!x) return;
    if(x.dataset.x === 'cancel') closeModal();
    if(x.dataset.x === 'ok'){
      if(onSave(bg) !== false){ closeModal(); render(); scheduleSave(); }
    }
  });
  document.addEventListener('keydown', function esc2(e){
    if(e.key === 'Escape'){ closeModal(); document.removeEventListener('keydown', esc2); }
  });
  var first = bg.querySelector('input, select, textarea');
  if(first) first.focus();
  return bg;
}
function setRows(sets){
  var rows = '';
  for(var i = 0; i < 5; i++){
    var s = sets[i] || ['',''];
    rows += '<div class="setrow"><span>Set ' + (i+1) + '</span>'
      + '<input type="number" min="0" max="30" data-set="' + i + '" data-side="0" value="' + (s[0] === '' ? '' : Number(s[0])) + '">'
      + '<span class="dash">–</span>'
      + '<input type="number" min="0" max="30" data-set="' + i + '" data-side="1" value="' + (s[1] === '' ? '' : Number(s[1])) + '">'
      + '</div>';
  }
  return rows;
}
function readSets(bg){
  var out = [];
  for(var i = 0; i < 5; i++){
    var a = bg.querySelector('[data-set="' + i + '"][data-side="0"]').value;
    var b = bg.querySelector('[data-set="' + i + '"][data-side="1"]').value;
    if(a === '' && b === '') continue;
    out.push([Number(a) || 0, Number(b) || 0]);
  }
  return out;
}
function matchModal(tid, mid){
  var b = bucket(tid);
  if(!b) return;
  var m = mid ? b.get().filter(function(x){ return x.id === mid; })[0] : null;
  var today = new Date().toISOString().slice(0,10);
  var body = '<div class="field"><label for="f-date">Date</label><input id="f-date" type="date" value="' + esc(m ? m.date : today) + '"></div>'
    + '<div class="field"><label>Score — ' + esc(state.players[0].name) + ' vs ' + esc(state.players[1].name) + '</label>'
    + setRows(m ? m.sets : []) + '<p class="hint">Leave a set empty if it was not played. The winner is whoever took more sets.</p></div>'
    + '<div class="field"><label for="f-note">Note</label><input id="f-note" type="text" maxlength="120" placeholder="Excuses, weather, injuries…" value="' + esc(m ? m.note : '') + '"></div>';
  var left = m ? '<button class="btn left" data-x="del">Delete match</button>' : '';
  var bg = openModal(m ? 'Edit match' : 'Add match', body, function(bg){
    var sets = readSets(bg);
    if(!sets.length){ alert('Add at least one set score.'); return false; }
    var data = {
      id: m ? m.id : uid(),
      date: bg.querySelector('#f-date').value,
      sets: sets,
      note: bg.querySelector('#f-note').value.trim()
    };
    if(m){
      b.set(b.get().map(function(x){ return x.id === m.id ? data : x; }));
    } else {
      b.set(b.get().concat([data]));
    }
  }, left);
  if(m){
    bg.querySelector('[data-x="del"]').addEventListener('click', function(){
      if(!confirm('Delete this match for good?')) return;
      b.set(b.get().filter(function(x){ return x.id !== m.id; }));
      closeModal(); render(); scheduleSave();
    });
  }
}
function tournamentModal(tid){
  var t = tid ? tour(tid) : null;
  var body = '<div class="field"><label for="f-name">Tournament name</label><input id="f-name" type="text" maxlength="60" value="' + esc(t ? t.name : '') + '" placeholder="Borscht Masters"></div>'
    + '<div class="field"><label for="f-emoji">Emoji</label><input id="f-emoji" type="text" maxlength="4" value="' + esc(t ? t.emoji : '🎾') + '"></div>'
    + '<div class="field"><label for="f-surface">Surface or vibe</label><input id="f-surface" type="text" maxlength="40" value="' + esc(t ? t.surface : '') + '" placeholder="Hard court, 35°C, no shade"></div>'
    + '<div class="field"><label for="f-champ">Champion</label><select id="f-champ">'
      + '<option value="">Not decided</option>'
      + '<option value="0"' + (t && t.champion === 0 ? ' selected' : '') + '>' + esc(state.players[0].name) + '</option>'
      + '<option value="1"' + (t && t.champion === 1 ? ' selected' : '') + '>' + esc(state.players[1].name) + '</option>'
      + '</select></div>'
    + '<div class="field"><label for="f-prize">Prize</label><input id="f-prize" type="text" maxlength="80" value="' + esc(t ? t.prize : '') + '" placeholder="A plate of pelmeni and eternal glory"></div>';
  var left = t ? '<button class="btn left" data-x="del">Delete tournament</button>' : '';
  var bg = openModal(t ? 'Tournament settings' : 'New tournament', body, function(bg){
    var name = bg.querySelector('#f-name').value.trim();
    if(!name){ alert('Give the tournament a name.'); return false; }
    var data = {
      name: name,
      emoji: bg.querySelector('#f-emoji').value.trim() || '🎾',
      surface: bg.querySelector('#f-surface').value.trim(),
      champion: bg.querySelector('#f-champ').value === '' ? null : Number(bg.querySelector('#f-champ').value),
      prize: bg.querySelector('#f-prize').value.trim()
    };
    if(t){
      t.name = data.name; t.emoji = data.emoji; t.surface = data.surface; t.champion = data.champion; t.prize = data.prize;
    } else {
      data.id = uid(); data.matches = [];
      state.tournaments.push(data);
      selected = data.id;
    }
  }, left);
  if(t){
    bg.querySelector('[data-x="del"]').addEventListener('click', function(){
      if(!confirm('Delete "' + t.name + '" and all its matches?')) return;
      state.tournaments = state.tournaments.filter(function(x){ return x.id !== t.id; });
      if(selected === t.id) selected = state.tournaments.length ? state.tournaments[0].id : null;
      closeModal(); render(); scheduleSave();
    });
  }
}
function titleModal(){
  var body = '<div class="field"><label for="f-t">Headline</label><input id="f-t" type="text" maxlength="40" value="' + esc(state.title) + '"></div>'
    + '<div class="field"><label for="f-s">Tagline</label><input id="f-s" type="text" maxlength="90" value="' + esc(state.subtitle) + '"></div>';
  openModal('Edit headline', body, function(bg){
    state.title = bg.querySelector('#f-t').value.trim() || state.title;
    state.subtitle = bg.querySelector('#f-s').value.trim();
  });
}
function nameModal(i){
  var body = '<div class="field"><label for="f-n">Player name</label><input id="f-n" type="text" maxlength="24" value="' + esc(state.players[i].name) + '"></div>';
  openModal('Rename player', body, function(bg){
    var v = bg.querySelector('#f-n').value.trim();
    if(!v){ alert('A name, please.'); return false; }
    state.players[i].name = v;
  });
}

/* ---------------- events ---------------- */
document.addEventListener('click', function(e){
  var el = e.target.closest && e.target.closest('[data-act]');
  if(!el) return;
  var act = el.dataset.act;
  if(act === 'select'){ selected = el.dataset.id; render(); return; }
  if(!canEdit) return;
  if(act === 'add-match'){ matchModal(el.dataset.id, null); }
  else if(act === 'edit-match'){ matchModal(el.dataset.id, el.dataset.m); }
  else if(act === 'add-tournament'){ tournamentModal(null); }
  else if(act === 'edit-tournament'){ tournamentModal(el.dataset.id); }
  else if(act === 'edit-title'){ titleModal(); }
  else if(act === 'edit-name'){ nameModal(Number(el.dataset.i)); }
  else if(act === 'swap'){
    var a = state.players[0].photo;
    state.players[0].photo = state.players[1].photo;
    state.players[1].photo = a;
    render(); scheduleSave();
  }
});

/* ---------------- boot ---------------- */
function bounceBall(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var b = document.getElementById('flyball');
  var hero = document.querySelector('.hero');
  if(!b || !hero) return;
  var w = hero.clientWidth, h = hero.clientHeight;
  var start = performance.now(), dur = 1400;
  b.style.opacity = '1';
  function step(now){
    var t = Math.min(1, (now - start) / dur);
    var x = 24 + (w - 60) * t;
    var y = h * 0.62 - Math.sin(Math.PI * t) * (h * 0.42) + Math.abs(Math.sin(Math.PI * t * 3)) * 6;
    b.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + (t * 720) + 'deg)';
    if(t < 1) requestAnimationFrame(step);
    else b.style.opacity = '0';
  }
  requestAnimationFrame(step);
}

render();
setTimeout(bounceBall, 350);

if(window.claude && typeof window.claude.use === 'function'){
  setStatus('Connecting…', true);
  window.claude.use('artifact').then(function(art){
    if(art){
      window.__artifact = art;
      mode = 'live'; canEdit = true;
      setStatus('Saved');
    } else {
      mode = 'local'; canEdit = true;
      var local = localLoad();
      if(local){ state = local; render(); }
      setStatus('Saved on this device');
    }
    render();
  }).catch(function(){
    mode = 'local';
    setStatus('Saved on this device');
  });
} else {
  mode = 'local';
  var local = localLoad();
  if(local){ state = local; render(); }
  setStatus('Saved in this browser');
  document.addEventListener('keydown', function(e){
    if(e.shiftKey && (e.key === 'D' || e.key === 'd') && !/input|textarea|select/i.test((e.target.tagName || ''))){
      var doc = buildDoc(state);
      if(!doc) return;
      var blob = new Blob([doc], {type:'text/html'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'index.html';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    }
  });
}
})();
</script></body></html>
